name: Structural checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum dependencies
        run: python -m pip install numpy pillow opencv-python-headless
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate output example
        run: python tools/validate_output.py sample_predictions.csv
      - name: Validate dataset if present
        run: |
          if [ -f dataset/meta.csv ]; then python tools/validate_local.py --dataset dataset; fi
